name: Caro Windows Smoke

on:
  push:
    branches:
      - ci/caro-windows-smoke-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-game:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Show runner identity
        shell: powershell
        run: |
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "USERNAME=$env:USERNAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect installed Windows C++ build tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host '=== PATH tools ==='
          foreach ($tool in @('msbuild.exe','cl.exe','devenv.exe','cmake.exe','ninja.exe')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "$tool => $($cmd.Source)"
            } else {
              Write-Host "$tool => NOT FOUND IN PATH"
            }
          }

          Write-Host '=== Visual Studio Installer / vswhere ==='
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            Write-Host "vswhere => $vswhere"
            Write-Host '-- all installations --'
            & $vswhere -all -products * -format json
            Write-Host '-- installations with MSBuild --'
            & $vswhere -all -products * -requires Microsoft.Component.MSBuild -property installationPath
            Write-Host '-- installations with VC x86/x64 tools --'
            & $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Write-Host '-- installations with MFC --'
            & $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.MFC -property installationPath
          } else {
            Write-Host 'vswhere => NOT FOUND'
          }

          Write-Host '=== Common Visual Studio folders ==='
          $roots = @(
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio')
          )
          foreach ($root in $roots) {
            Write-Host "ROOT: $root"
            if (Test-Path $root) {
              Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Select-Object FullName
              Write-Host 'MSBuild candidates:'
              Get-ChildItem $root -Filter MSBuild.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
              Write-Host 'cl.exe candidates:'
              Get-ChildItem $root -Filter cl.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
            } else {
              Write-Host 'Folder does not exist.'
            }
          }

          Write-Host '=== Windows SDK ==='
          $kits10 = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $kits81 = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1'
          Write-Host "Windows Kits 10 exists: $(Test-Path $kits10)"
          Write-Host "Windows Kits 8.1 exists: $(Test-Path $kits81)"
          if (Test-Path (Join-Path $kits10 'bin')) {
            Get-ChildItem (Join-Path $kits10 'bin') -Directory -ErrorAction SilentlyContinue | Select-Object -Last 10 Name,FullName
          }

          Write-Host '=== Diagnostic complete ==='

      - name: Build updated Caro
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = $null

          if (Test-Path $vswhere) {
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          }

          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }

          if (-not $msbuild) {
            throw 'MSBuild was not found on this self-hosted runner.'
          }

          Write-Host "Using MSBuild: $msbuild"
          $solution = Join-Path $env:GITHUB_WORKSPACE 'vebanco.sln'
          $attempts = @(
            @{ Name = 'project defaults'; Args = @() },
            @{ Name = 'v143 + Windows 10 SDK'; Args = @('/p:PlatformToolset=v143','/p:WindowsTargetPlatformVersion=10.0') },
            @{ Name = 'v142 + Windows 10 SDK'; Args = @('/p:PlatformToolset=v142','/p:WindowsTargetPlatformVersion=10.0') },
            @{ Name = 'v141 + Windows 10 SDK'; Args = @('/p:PlatformToolset=v141','/p:WindowsTargetPlatformVersion=10.0') },
            @{ Name = 'v140 + Windows 10 SDK'; Args = @('/p:PlatformToolset=v140','/p:WindowsTargetPlatformVersion=10.0') }
          )

          $built = $false
          foreach ($attempt in $attempts) {
            Write-Host "=== Build attempt: $($attempt.Name) ==="
            $args = @($solution, '/m', '/t:Rebuild', '/p:Configuration=Debug', '/p:Platform=Win32', '/nologo') + $attempt.Args
            & $msbuild @args
            if ($LASTEXITCODE -eq 0) {
              $built = $true
              Write-Host "Build succeeded with: $($attempt.Name)"
              break
            }
          }

          if (-not $built) {
            throw 'All MSBuild attempts failed.'
          }

      - name: Inspect executable
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'Debug\vebanco.exe'
          if (-not (Test-Path $exe)) {
            throw "Missing executable after build: $exe"
          }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Launch Caro and capture desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'Debug\vebanco.exe'

          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Write-Host "Started PID $($process.Id) on runner $env:RUNNER_NAME"

          Start-Sleep -Seconds 4
          $process.Refresh()
          if ($process.HasExited) {
            throw "Caro exited before screenshot. ExitCode=$($process.ExitCode)"
          }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bounds.Size)
            $pngPath = Join-Path $artifactDir 'caro-ui-desktop.png'
            $bitmap.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }

          Write-Host "Saved screenshot: $pngPath"
          Start-Sleep -Seconds 4
          $process.Refresh()
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

      - name: Upload Caro UI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caro-ui-${{ github.run_number }}
          path: artifacts/*.png
          if-no-files-found: warn
